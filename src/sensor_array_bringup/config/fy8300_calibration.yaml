# Dedicated DC startup. Never load signal_generator's output-enabled defaults.
search_ports:
  - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baudrate: 115200
status_poll_rate: 1.0
initial_configs:
  - {channel_index: 1, waveform: 6, frequency: 0.0, amplitude: 0.0, offset: 0.0, phase: 0.0, output_en: false, output_sync: false}
  - {channel_index: 2, waveform: 6, frequency: 0.0, amplitude: 0.0, offset: 0.0, phase: 0.0, output_en: false}
  - {channel_index: 3, waveform: 6, frequency: 0.0, amplitude: 0.0, offset: 0.0, phase: 0.0, output_en: false}
