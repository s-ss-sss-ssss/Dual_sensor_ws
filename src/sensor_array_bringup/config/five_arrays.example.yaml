# Historical filename retained, but this is now a SINGLE-BOARD template.
# For five arrays, copy this YAML five times, with distinct IDs, ports and
# measured sensor_correction directories. Include fixed array.launch once per
# YAML (config:=absolute-path); do not restore a top-level devices list.
# WARNING: firmware_device_id: 0 is an explicit placeholder, not a known ID.
# WARNING: ak/affine.json and tmag/affine.json are placeholders; see the config guide:
# ../../sensor_array_config/config/README.md. Replace before hardware use.
device_id: array_01
firmware_device_id: 0
check_device_id: true
port: /dev/sensor_array_01
baud_rate: 115200
sensor_correction_dir: ../../sensor_array_config/config
raw_scale: 1.0
expected_ak: []
expected_tmag: []
expect_icm: false
# Nodes and relative topics are placed in /<device_id>.
