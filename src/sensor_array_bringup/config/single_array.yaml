# One YAML per board. No launch generation or configuration snapshots.
# WARNING: firmware_device_id: 0 is an explicit placeholder: replace with the
# actual firmware uint32 ID before hardware use.
# WARNING: the device's ak/affine.json and tmag/affine.json are placeholders, not measured.
# See ../../sensor_array_config/config/README.md for sensor_correction provenance.
# This is a root directory reference, not a sensor_array_config Python dependency.
# Usage: rosrun sensor_array_bringup bringup --config <this-file> --check
# Or: roslaunch sensor_array_bringup array.launch config:=<absolute-yaml-path>
device_id: array_01
firmware_device_id: 3063479653
check_device_id: true
port: /dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_315E39623233-if00
baud_rate: 115200
sensor_correction_dir: ../../sensor_array_config/config
# 额外缩放，通常保持 1.0；AK 的 1.1 uT/count 已在代码中单独应用。
raw_scale: 1.0
# 合成场强 |B| 的上限，单位与校正输出相同；1000 仅为示例，请按实际量程修改。
field_range: 3604.0 # AK Sensor, 3604 uT
# Paths are relative to this YAML, or absolute; $(find pkg) is supported lazily.
# Nodes and relative topics are placed in /<device_id>.
# Exact transmitted byte pairs; no confirmed address-to-chip-ID mapping.
# Empty expectations make protocol completeness trivial, not hardware proof.
expected_ak: []
expected_tmag: []
expect_icm: false
